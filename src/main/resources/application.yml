spring:
  application:
    name: parkingmanager
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://localhost:5432/parkingmanager
    username: docker
    password: docker
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

  logging:
    pattern:
      console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n'
    file:
      name: parking-manager.log
    level:
      root: warn
      io:
        github:
          api_parking_manager: trace
      org:
        springframework:
          web: debug
          security: trace

# Níveis de log por ordem de hierarquia, lembrando que ao habilitar um nível de log, todos abaixo dele serão habilitados também.
# trace
# debug
# info
# warn
# error

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
          include: '*' 

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}

springdoc:
  override-with-generic-response: false
